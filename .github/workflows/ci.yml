name: Research reference checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: python studies/manuscript_revision/experiments/check_revision.py -v
      - run: python tools/verify_frozen_study.py
      - run: val audit
      - run: val demo --output local_results/demo
      - run: val benchmark --seeds 2 --observations 40 --queries 8 --capacity 8 --shadow-capacity 8 --output local_results/benchmark.json
