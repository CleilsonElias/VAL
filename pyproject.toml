[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "val-reference"
version = "0.2.0"
description = "Domain-selective inhibition and bounded external memory: a VAL research reference"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Cleilson Elias de Sousa"}]
dependencies = []
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.scripts]
val = "val_memory.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

